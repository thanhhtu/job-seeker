services:
    job-seeker-db:
        container_name: job-seeker-db
        build: ./docker/postgres
        image: postgres-pg_textsearch:latest
        command: postgres -c shared_preload_libraries=pg_textsearch
        environment:
            - POSTGRES_DB=${DATABASE_DB}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_USER=${DATABASE_USER}
        ports:
            - "5433:5432"
        volumes:
            - job-seeker-data:/var/lib/postgresql/data 
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - job-seeker-network

    embedding-ollama:
        container_name: embedding-ollama
        build: ./docker/embedding
        ports:
            - "11434:11434"
        volumes:
            - embedding-data:/root/.embedding_cache
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        networks:
            - job-seeker-network

    bge-reranker:
        container_name: bge-reranker
        build:
            context: ./docker/reranker
            args:
                - TARGETARCH=${TARGETARCH:-amd64}
        ports:
            - "8000:8000"
        volumes:
            - reranker-model-cache:/root/.cache/huggingface
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        networks:
            - job-seeker-network

volumes:
    job-seeker-data:
    embedding-data:
    reranker-model-cache:

networks:
    job-seeker-network:
        driver: bridge
